name: Python Calculator CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python version
        run: python3 --version

      - name: Check Python syntax
        run: python3 -m py_compile app/calculator.py

      - name: Run calculator app
        run: python3 app/calculator.py
